<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">AUREVIA abstract signal field</title>
  <desc id="desc">Dark editorial background with luminous gold orbital lines.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090b0d"/>
      <stop offset=".58" stop-color="#111516"/>
      <stop offset="1" stop-color="#1d1710"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="42%" r="42%">
